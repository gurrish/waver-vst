name: Deploy website to Azure Static Web Apps

on:
  push:
    branches: [master]
    paths:
      - 'website/**'
      - '.github/workflows/azure-deploy.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          # Add this secret in your repo:
          # GitHub repo → Settings → Secrets → Actions → New secret
          # Name:  AZURE_STATIC_WEB_APPS_API_TOKEN
          # Value: deployment token from Azure portal
          #        (Azure → Static Web App resource → Overview → Manage deployment token)
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: website      # folder containing index.html
          output_location: ''        # no build step — pure static files
          skip_app_build: true
