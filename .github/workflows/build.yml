name: Build & Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

jobs:
  build-windows:
    name: Build VST3 (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout (with JUCE submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build
          key: cmake-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}-${{ hashFiles('JUCE/**') }}
          restore-keys: cmake-${{ runner.os }}-

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        run: |
          $artefacts = "build/WaverVST_artefacts/Release"
          Compress-Archive -Path "$artefacts/VST3/Waver.vst3" -DestinationPath "Waver-VST3-windows-x64.zip"
          Compress-Archive -Path "$artefacts/Standalone/Waver.exe" -DestinationPath "Waver-Standalone-windows-x64.zip"

      - name: Upload VST3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waver-VST3-windows-x64
          path: Waver-VST3-windows-x64.zip

      - name: Upload Standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: Waver-Standalone-windows-x64
          path: Waver-Standalone-windows-x64.zip

      # Only create a GitHub Release when a version tag is pushed (e.g. v1.0.0)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Waver-VST3-windows-x64.zip
            Waver-Standalone-windows-x64.zip
          generate_release_notes: true
